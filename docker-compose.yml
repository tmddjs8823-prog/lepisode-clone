version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lepisode-db
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_DB: lepisode
      POSTGRES_USER: lepisode
      POSTGRES_PASSWORD: lepisode1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lepisode']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
