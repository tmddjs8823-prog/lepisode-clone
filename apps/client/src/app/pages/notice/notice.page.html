<section class="py-20 pb-24" id="notice">
  <div class="max-w-[700px] mx-auto px-6">

    <!-- 타이틀 -->
    <div class="mb-12">
      <span class="text-sm font-semibold text-[#41539b] block mb-2">📢 공지사항</span>
      <h1 class="text-[1.8rem] font-extrabold text-[#1a1a2e] mb-2">레피소드 공지사항</h1>
      <p class="text-sm text-gray-400">레피소드의 공지사항을 살펴보세요.</p>
    </div>

    <!-- 공지 리스트 -->
    <div class="flex flex-col">
      @for (item of notices(); track item.id) {
        <a [routerLink]="['/notice', item.id]"
           class="block border-b border-gray-100 py-6 cursor-pointer hover:bg-gray-50/50 transition-colors -mx-4 px-4 rounded-lg">
          <!-- 날짜 -->
          <div class="flex justify-end mb-1">
            <span class="text-xs text-[#41539b]">{{ item.createdAt | date:'yyyy.MM.dd' }}</span>
          </div>
          <!-- 제목 -->
          <h3 class="text-base font-bold text-[#1a1a2e] mb-2">{{ item.title }}</h3>
          <!-- 내용 미리보기 -->
          <p class="text-sm text-gray-400 line-clamp-1 mb-3">{{ item.content }}</p>
          <!-- 자세히보기 -->
          <span class="text-sm font-medium text-[#41539b] flex items-center gap-1">
            자세히보기 ↗
          </span>
        </a>
      } @empty {
        <div class="py-16 text-center">
          <p class="text-gray-400">등록된 공지사항이 없습니다.</p>
        </div>
      }
    </div>

    <!-- 페이지네이션 -->
    @if (totalPages() > 1) {
      <div class="flex justify-center items-center gap-2 mt-12">
        @for (p of getPages(); track p) {
          <button class="w-8 h-8 rounded-md text-sm font-medium transition-all"
                  [class]="currentPage() === p ? 'bg-[#41539b] text-white' : 'text-gray-400 hover:text-gray-600'"
                  (click)="loadPage(p)">
            {{ p }}
          </button>
        }
      </div>
    }

  </div>
</section>
