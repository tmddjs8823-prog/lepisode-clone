<section class="py-20 pb-24" id="notice-detail">
  <div class="max-w-[700px] mx-auto px-6">

    @if (notice(); as n) {
      <!-- 뒤로가기 -->
      <button class="inline-flex items-center justify-center w-10 h-10 border-none bg-transparent text-gray-700 cursor-pointer rounded-[10px] transition-colors hover:bg-gray-100 mb-8"
              (click)="goBack()">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <!-- 헤더 -->
      <div class="mb-10">
        <span class="text-sm font-semibold text-[#41539b] block mb-2">{{ 'notice.label' | translate }}</span>
        <h1 class="text-[1.8rem] font-extrabold text-[#1a1a2e] mb-2">{{ loc(n, 'title') }}</h1>
        <span class="text-sm text-gray-400">{{ n.createdAt | date:'yyyy.MM.dd' }}</span>
      </div>

      <!-- 썸네일 -->
      @if (n.thumbnailUrl) {
        <div class="mb-8">
          <img [src]="n.thumbnailUrl" [alt]="n.title"
               class="w-full rounded-lg object-cover" />
        </div>
      }

      <!-- 본문 -->
      <div class="text-[0.92rem] text-gray-600 leading-relaxed whitespace-pre-line">
        {{ loc(n, 'content') }}
      </div>
    } @else {
      <div class="py-16 text-center">
        <p class="text-gray-400">Loading...</p>
      </div>
    }

  </div>
</section>
