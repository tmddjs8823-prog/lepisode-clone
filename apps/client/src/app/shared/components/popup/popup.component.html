@for (popup of popups(); track popup.id) {
  <!-- 오버레이 -->
  <div class="popup-overlay" (click)="close(popup.id)"></div>

  <!-- 팝업 카드 -->
  <div class="popup-card">
    <!-- X 닫기 버튼 -->
    <button class="popup-close" (click)="close(popup.id)" aria-label="닫기">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- 이미지 영역 -->
    <div class="popup-image-wrap" (click)="onImageClick(popup)">
      @if (popup.imageUrl) {
        <img [src]="popup.imageUrl" [alt]="popup.title" class="popup-image" />
      } @else {
        <div class="popup-placeholder">
          <span class="popup-placeholder-text">{{ popup.title }}</span>
        </div>
      }
    </div>

    <!-- 하단 버튼 -->
    <div class="popup-footer">
      <button class="popup-footer-btn dismiss" (click)="dismissToday(popup.id)">오늘 하루 보지 않기</button>
      <button class="popup-footer-btn close-btn" (click)="close(popup.id)">닫기</button>
    </div>
  </div>
}
