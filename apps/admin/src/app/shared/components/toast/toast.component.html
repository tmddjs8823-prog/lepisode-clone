<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
  @for (toast of toastService.toasts(); track trackById($index, toast)) {
    <div
      class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-sm font-medium border backdrop-blur-sm transition-all duration-300 animate-slide-in"
      [class]="
        toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200' :
        toast.type === 'error'   ? 'bg-red-950/90 border-red-500/30 text-red-200' :
        toast.type === 'warning' ? 'bg-amber-950/90 border-amber-500/30 text-amber-200' :
                                   'bg-slate-800/90 border-slate-600/30 text-slate-200'
      "
    >
      <!-- Icon -->
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        @if (toast.type === 'success') {
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        } @else if (toast.type === 'error') {
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        } @else if (toast.type === 'warning') {
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        }
      </svg>

      <span class="flex-1">{{ toast.message }}</span>

      <button
        class="shrink-0 opacity-60 hover:opacity-100 transition-opacity"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
