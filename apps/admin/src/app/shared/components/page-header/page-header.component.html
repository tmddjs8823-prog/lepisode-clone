<div class="flex items-center justify-between">
  <div>
    <h2 class="text-xl font-bold text-white">{{ title() }}</h2>
    <p class="text-xs text-slate-400 mt-0.5">{{ title() }} 목록을 관리합니다.</p>
  </div>
  <div class="flex items-center gap-2">
    @if (showCreate()) {
      <button
        id="btn-create"
        class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors"
        (click)="create.emit()"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        {{ createLabel() }}
      </button>
    }
    @if (showExport()) {
      <button
        id="btn-export-excel"
        class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors"
        title="엑셀 다운로드"
        (click)="exportExcel.emit()"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </button>
    }
  </div>
</div>
