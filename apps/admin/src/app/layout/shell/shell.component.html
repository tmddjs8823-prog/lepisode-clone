<div class="flex h-screen overflow-hidden bg-slate-950">
  <!-- Sidebar -->
  <admin-sidebar />

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- ── Sticky Top Bar ── -->
    <div class="sticky top-0 z-20 flex items-center justify-between px-6 py-3 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/60 shrink-0 transition-all duration-300"
         [class.shadow-lg]="scrolled"
         [class.shadow-black/20]="scrolled">

      <!-- 좌측: 빵가루 / 환영 메시지 -->
      <div class="flex items-center gap-2">
        @if (currentUser(); as user) {
          <span class="text-sm text-slate-500">안녕하세요,</span>
          <span class="text-sm font-semibold text-white">{{ user.name }}</span>
          <span class="text-xs text-slate-600">님</span>
        }
      </div>

      <!-- 우측: 벨 + 유저 -->
      <div class="flex items-center gap-1">
        <button class="p-2 text-slate-500 hover:text-white transition-colors rounded-lg hover:bg-slate-800/60">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
          </svg>
        </button>

        <div class="relative">
          <button class="p-2 text-slate-500 hover:text-white transition-colors rounded-lg hover:bg-slate-800/60" (click)="toggleUserMenu()">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </button>

          @if (showUserMenu()) {
            <div class="fixed inset-0 z-40" role="button" tabindex="-1" (click)="closeUserMenu()" (keydown.escape)="closeUserMenu()"></div>

            <div class="absolute right-0 top-12 z-50 w-52 bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden">
              @if (currentUser(); as user) {
                <div class="px-4 py-3 border-b border-slate-100">
                  <div class="flex items-center gap-2.5">
                    <svg class="w-5 h-5 text-slate-600 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <div>
                      <p class="text-sm font-bold text-indigo-600">{{ user.name }}</p>
                      <p class="text-xs text-slate-400">{{ user.role }}</p>
                    </div>
                  </div>
                </div>
              }
              <button class="w-full flex items-center gap-2.5 px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 transition-colors" (click)="logout()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                로그아웃
              </button>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Page Content -->
    <div class="flex-1 overflow-y-auto" #mainContent (scroll)="onScroll($event)">
      <router-outlet />
    </div>
  </main>
</div>

<!-- Global Toast -->
<admin-toast />
