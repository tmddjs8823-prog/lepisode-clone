<div class="flex flex-col h-full">

  <div class="pt-6 px-6">
    <admin-page-header title="약관 관리" [showCreate]="false" [showExport]="false" />
  </div>

  <!-- ── 탭 메뉴 ── -->
  <div class="border-b border-slate-700/50 bg-transparent pt-10 px-6 shrink-0">
    <div class="flex w-full overflow-x-auto no-scrollbar">
      @for (tab of tabs; track tab.id) {
        <button
          class="relative lg:flex-1 text-center px-4 lg:px-0 py-4 text-sm font-semibold whitespace-nowrap transition-colors shrink-0"
          [class.text-indigo-400]="activeTab() === tab.id"
          [class.text-slate-500]="activeTab() !== tab.id"
          [class.hover:text-slate-300]="activeTab() !== tab.id"
          (click)="setTab(tab.id)">
          {{ tab.label }}
          @if (activeTab() === tab.id) {
            <div class="absolute bottom-0 left-0 w-full h-0.5 bg-indigo-500"></div>
          }
        </button>
      }
    </div>
  </div>

  <!-- ── 본문 영역 ── -->
  <div class="flex-1 p-6 overflow-y-auto">
    <!-- 컨텐츠 래퍼 카드 -->
    <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl overflow-hidden shadow-sm flex flex-col min-h-full">
      
      <!-- 아코디언 헤더 -->
      <button 
        class="flex items-center justify-between w-full px-6 py-5 text-left border-b border-slate-700/50 hover:bg-slate-800 transition-colors"
        (click)="toggleEditor()">
        <span class="text-base font-bold text-slate-200">{{ activeTabLabel() }}</span>
        <svg 
          class="w-5 h-5 text-slate-400 transition-transform duration-200" 
          [class.rotate-180]="isEditorOpen()"
          fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <!-- 에디터 영역 -->
      @if (isEditorOpen()) {
        <div class="flex-1 flex flex-col p-6 gap-6">
          <admin-rich-editor class="w-full flex-1" [ngModel]="currentContent()" (ngModelChange)="currentContent.set($event)" />

          <!-- 풀위드 저장 버튼 -->
          <button 
            class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 disabled:opacity-50"
            [disabled]="saving()"
            (click)="save()">
            @if (saving()) {
              <span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            }
            저장
          </button>
        </div>
      }
      
    </div>
  </div>

</div>
