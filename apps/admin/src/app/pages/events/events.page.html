<style>
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-drawer { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-backdrop { animation: fadeIn 0.2s ease-out forwards; }
</style>

<div class="flex flex-col gap-6 p-6">

  <!-- ── 헤더 ── -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-white">이벤트 관리</h2>
      <p class="text-xs text-slate-400 mt-0.5">이벤트를 등록하고 관리합니다.</p>
    </div>
    <div class="flex items-center gap-2">
      <button
        class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors"
        (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        이벤트 등록
      </button>
      <button
        class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors"
        title="엑셀 다운로드"
        (click)="onExportExcel()"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- ── 데이터 그리드 ── -->
  <admin-data-table
    [columns]="columns"
    [data]="$any(data())"
    [loading]="loading()"
    [total]="data().length"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))"
  />

</div>


<!-- 사이드 서랍: 이벤트 등록/수정 -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>
    <div class="relative w-full max-w-lg h-full bg-slate-900 border-l border-slate-700/60 shadow-2xl flex flex-col animate-drawer" tabindex="-1" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">

      <!-- 헤더 -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 shrink-0">
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
        <button class="p-2 -mr-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-colors" (click)="closeForm()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 본문 -->
      <div class="flex flex-col gap-5 p-6 flex-1 overflow-y-auto">

        <!-- 이벤트명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-event-title" class="text-sm font-semibold text-slate-200">이벤트명 <span class="text-red-400">*</span></label>
          <input id="input-event-title" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="이벤트명" [ngModel]="fTitle()" (ngModelChange)="fTitle.set($event)" />
        </div>

        <!-- 영문명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-event-title-en" class="text-sm font-semibold text-slate-200">영문명 <span class="text-red-400">*</span></label>
          <input id="input-event-title-en" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="Event name in English" [ngModel]="fTitleEn()" (ngModelChange)="fTitleEn.set($event)" />
        </div>

        <!-- 일본어명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-event-title-ja" class="text-sm font-semibold text-slate-200">일본어명 <span class="text-red-400">*</span></label>
          <input id="input-event-title-ja" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="イベント名" [ngModel]="fTitleJa()" (ngModelChange)="fTitleJa.set($event)" />
        </div>

        <!-- 이벤트 기간 -->
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-slate-200">이벤트 기간 <span class="text-red-400">*</span></span>
          <div class="flex items-center gap-2">
            <input type="date" class="flex-1 bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" [ngModel]="fStartDate()" (ngModelChange)="fStartDate.set($event)" />
            <span class="text-slate-500 text-xs">~</span>
            <input type="date" class="flex-1 bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" [ngModel]="fEndDate()" (ngModelChange)="fEndDate.set($event)" />
          </div>
        </div>

        <!-- 선정일 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-event-selected-date" class="text-sm font-semibold text-slate-200">선정일</label>
          <input id="input-event-selected-date" type="date" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" [ngModel]="fSelectedDate()" (ngModelChange)="fSelectedDate.set($event)" />
        </div>

        <!-- 내용 -->
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-slate-200">내용</span>
          <admin-rich-editor [ngModel]="fContent()" (ngModelChange)="fContent.set($event)" />
        </div>

        <!-- 파일 첨부 -->
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-slate-200">파일 첨부</span>
          @if (fAttachName()) {
            <div class="flex items-center gap-2 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg">
              <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
              <span class="text-slate-300 text-xs flex-1 truncate">{{ fAttachName() }}</span>
              <button class="text-slate-500 hover:text-red-400 transition-colors" (click)="removeFile()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          } @else {
            <label class="flex items-center gap-2 px-3 py-2 bg-slate-800 border border-dashed border-slate-600 rounded-lg cursor-pointer hover:border-indigo-500 transition-colors">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
              <span class="text-slate-400 text-xs">파일 선택</span>
              <input type="file" class="hidden" (change)="onFileSelect($event)" />
            </label>
          }
        </div>

        <!-- 게시 여부 -->
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold text-slate-200">게시 여부</span>
          <button
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
            [class]="fPublished() ? 'bg-indigo-600' : 'bg-slate-700'"
            (click)="fPublished.set(!fPublished())">
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" [class]="fPublished() ? 'translate-x-6' : 'translate-x-1'"></span>
          </button>
          <span class="text-xs" [class]="fPublished() ? 'text-indigo-400' : 'text-slate-500'">{{ fPublished() ? '게시중' : '비공개' }}</span>
        </div>

      </div>

      <!-- 푸터 -->
      <div class="px-6 py-4 border-t border-slate-800 shrink-0 flex gap-3">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">닫기</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50" [disabled]="saving()" (click)="save()">
          {{ saving() ? '저장 중...' : '저장' }}
        </button>
      </div>

    </div>
  </div>
}

<!-- 삭제 확인 다이얼로그 -->
@if (deleteTarget()) {
  <admin-confirm-dialog
    title="이벤트 삭제"
    message="이 이벤트를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다."
    confirmLabel="삭제"
    [loading]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}
