<div class="flex flex-col gap-6 p-6">
  <admin-page-header title="지원사업 관리" createLabel="지원사업 등록" [showExport]="true" (exportExcel)="onExportExcel()" (create)="openForm()" />

  <admin-data-table
    [columns]="columns"
    [data]="$any(data())"
    [loading]="loading()"
    [total]="data().length"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))"
  />
</div>


<!-- 폼 모달 (사이드 서랍 방식) -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- 백그라운드 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" (click)="closeForm()" (keydown.enter)="closeForm()" tabindex="0" role="button" aria-label="Close form"></div>
    
    <!-- 서랍 컨테이너 -->
    <div class="relative w-full max-w-md h-full bg-slate-900 border-l border-slate-700/60 shadow-2xl flex flex-col animate-drawer" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" tabindex="-1">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 shrink-0">
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
        <button class="p-2 -mr-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-colors" (click)="closeForm()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="flex flex-col gap-5 p-6 overflow-y-auto flex-1 bg-slate-900">
        <div class="flex flex-col gap-1.5">
          <label for="input-title" class="text-xs font-medium text-slate-400">지원사업명 <span class="text-red-400">*</span></label>
          <input id="input-title" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-colors" [ngModel]="fTitle()" (ngModelChange)="fTitle.set($event)" (blur)="autoSlug()" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="input-slug" class="text-xs font-medium text-slate-400">슬러그 <span class="text-red-400">*</span></label>
          <input id="input-slug" type="text" class="w-full bg-slate-800 border border-slate-700 text-indigo-300 text-sm font-mono rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="url-friendly-slug" [ngModel]="fSlug()" (ngModelChange)="fSlug.set($event)" />
          <p class="text-xs text-slate-500">영문 소문자, 숫자, 하이픈만 허용. 제목 입력 후 자동 생성됩니다.</p>
        </div>
        <div class="flex items-center gap-6 mt-2">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" class="sr-only peer" [ngModel]="fPublished()" (ngModelChange)="fPublished.set($event)" />
            <div class="relative w-9 h-5 rounded-full transition-colors peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-500 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-900" [class]="fPublished() ? 'bg-indigo-600' : 'bg-slate-700'">
              <span class="absolute top-[2px] w-4 h-4 bg-white rounded-full shadow transition-all" [class]="fPublished() ? 'left-[18px]' : 'left-[2px]'"></span>
            </div>
            <span class="text-sm text-slate-300 select-none">노출 활성화</span>
          </label>
          <div class="flex items-center gap-2">
            <label for="input-sort" class="text-xs text-slate-400">정렬순서</label>
            <input id="input-sort" type="number" class="w-20 bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 transition-colors" [ngModel]="fSortOrder()" (ngModelChange)="fSortOrder.set(+$event)" />
          </div>
        </div>
      </div>
      <div class="flex gap-3 px-6 py-5 border-t border-slate-800 shrink-0">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">취소</button>
        <button id="btn-save" class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> }
          저장
        </button>
      </div>
    </div>
  </div>
}

@if (deleteTarget()) {
  <admin-confirm-dialog message="지원사업을 삭제하시겠습니까?" [loading]="deleting()" (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
}
