<div class="flex flex-col gap-6 p-6">
  <admin-page-header title="현황 관리" />

  <!-- 상태 필터 탭 -->
  <div class="flex flex-col gap-0">
    <div class="flex items-center gap-6">
      <button class="text-sm font-medium pb-2 transition-colors"
        [class]="!filterStatus() ? 'text-white border-b-2 border-indigo-500' : 'text-slate-500 hover:text-slate-300'"
        (click)="filterStatus.set('')">전체</button>
      <button class="text-sm font-medium pb-2 transition-colors"
        [class]="filterStatus() === 'ESTIMATING' ? 'text-white border-b-2 border-indigo-500' : 'text-slate-500 hover:text-slate-300'"
        (click)="filterStatus.set('ESTIMATING')">견적중</button>
      <button class="text-sm font-medium pb-2 transition-colors"
        [class]="filterStatus() === 'IN_PROGRESS' ? 'text-white border-b-2 border-indigo-500' : 'text-slate-500 hover:text-slate-300'"
        (click)="filterStatus.set('IN_PROGRESS')">진행중</button>
      <button class="text-sm font-medium pb-2 transition-colors"
        [class]="filterStatus() === 'ANSWERED' ? 'text-white border-b-2 border-indigo-500' : 'text-slate-500 hover:text-slate-300'"
        (click)="filterStatus.set('ANSWERED')">답변완료</button>
      <button class="text-sm font-medium pb-2 transition-colors"
        [class]="filterStatus() === 'COMPLETE' ? 'text-white border-b-2 border-indigo-500' : 'text-slate-500 hover:text-slate-300'"
        (click)="filterStatus.set('COMPLETE')">납품완료</button>
    </div>
    <div class="border-b border-slate-700/60"></div>
  </div>

  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="data().length"
    (rowClick)="navigateToDetail($any($event))"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))">

    <!-- 검색 바 -->
    <div search-bar class="relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input type="text" class="w-full bg-slate-800/60 border border-slate-700/60 text-slate-200 text-sm rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:border-indigo-500/60 focus:bg-slate-800 placeholder-slate-500 transition-colors" placeholder="프로젝트명 검색" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
    </div>
    <!-- 액션 바 -->
    <div action-bar class="flex items-center gap-2">
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors" (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        현황 등록
      </button>
      <button class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors" title="엑셀 다운로드" (click)="onExportExcel()">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </admin-data-table>
</div>


<!-- 폼 모달 (스크린샷 기반 수직형 디자인 적용) -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- 백그라운드 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" (click)="closeForm()" (keydown.enter)="closeForm()" tabindex="0"></div>
    
    <!-- 서랍 컨테이너 -->
    <div class="relative w-full max-w-2xl h-full bg-slate-900 shadow-2xl flex flex-col animate-drawer" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" tabindex="-1">
      <!-- 모달 헤더 -->
      <div class="px-6 py-4 border-b border-slate-800 shrink-0">
        <button class="text-slate-500 hover:text-white text-lg mb-2 transition-colors" (click)="closeForm()">&raquo;</button>
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
      </div>

      <!-- 모달 본문 (스크롤) -->
      <div class="p-6 overflow-y-auto flex-1 bg-slate-900 flex flex-col gap-6">
        
        <!-- 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-title" class="text-sm font-semibold text-slate-200">제목 <span class="text-indigo-500">*</span></label>
          <input id="project-title" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" placeholder="제목을 입력해주세요" [ngModel]="fTitle()" (ngModelChange)="fTitle.set($event)" />
        </div>

        <!-- 영문 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-title-en" class="text-sm font-semibold text-slate-200">영문 제목 <span class="text-indigo-500">*</span></label>
          <input id="project-title-en" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" placeholder="영문 제목을 입력해주세요" [ngModel]="fTitleEn()" (ngModelChange)="fTitleEn.set($event)" />
        </div>

        <!-- 일어 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-title-ja" class="text-sm font-semibold text-slate-200">일어 제목 <span class="text-indigo-500">*</span></label>
          <input id="project-title-ja" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" placeholder="일어 제목을 입력해주세요" [ngModel]="fTitleJa()" (ngModelChange)="fTitleJa.set($event)" />
        </div>

        <!-- 클라이언트 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-client" class="text-sm font-semibold text-slate-200">클라이언트 <span class="text-indigo-500">*</span></label>
          <input id="project-client" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" placeholder="클라이언트를 입력해주세요" [ngModel]="fClient()" (ngModelChange)="fClient.set($event)" />
        </div>

        <!-- 플랫폼 (체크박스) -->
        <div class="flex flex-col gap-2">
          <div class="text-sm font-semibold text-slate-200">플랫폼</div>
          <div class="flex items-center gap-6">
            @for (opt of platformOptions; track opt) {
              <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-400">
                <input type="checkbox" class="w-4 h-4 text-indigo-600 border-slate-600 rounded focus:ring-indigo-500 cursor-pointer" [checked]="fPlatforms().includes(opt)" (change)="togglePlatform(opt)" />
                {{ opt }}
              </label>
            }
          </div>
        </div>

        <!-- 시작일 / 종료일 -->
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="project-start-date" class="text-sm font-semibold text-slate-200">시작일 <span class="text-indigo-500">*</span></label>
            <input id="project-start-date" type="date" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" [ngModel]="fStartDate()" (ngModelChange)="fStartDate.set($event)" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="project-end-date" class="text-sm font-semibold text-slate-200">종료일 <span class="text-indigo-500">*</span></label>
            <input id="project-end-date" type="date" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" [ngModel]="fEndDate()" (ngModelChange)="fEndDate.set($event)" />
          </div>
        </div>

        <!-- 상태 (라디오 버튼) -->
        <div class="flex flex-col gap-2">
          <div class="text-sm font-semibold text-slate-200">상태</div>
          <div class="flex items-center gap-6">
            @for (opt of statusOptions; track opt) {
              <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-400">
                <input type="radio" name="status" class="w-4 h-4 text-indigo-600 border-slate-600 focus:ring-indigo-500 cursor-pointer" [value]="opt" [ngModel]="fStatus()" (ngModelChange)="fStatus.set($event)" />
                {{ statusMeta[opt].label }}
              </label>
            }
          </div>
        </div>

        <!-- 이메일 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-email" class="text-sm font-semibold text-slate-200">이메일 <span class="text-indigo-500">*</span></label>
          <input id="project-email" type="email" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" placeholder="이메일을 입력해주세요" [ngModel]="fEmail()" (ngModelChange)="fEmail.set($event)" />
        </div>

        <!-- 전화번호 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-phone" class="text-sm font-semibold text-slate-200">전화번호 <span class="text-indigo-500">*</span></label>
          <input id="project-phone" type="tel" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" placeholder="전화번호를 입력해주세요" [ngModel]="fPhone()" (ngModelChange)="fPhone.set($event)" />
        </div>

        <!-- 문서 (파일 업로드) -->
        <div class="flex flex-col gap-2">
          <div class="text-sm font-semibold text-slate-200">문서</div>
          <div class="flex flex-col items-center justify-center p-8 border border-dashed border-slate-600 bg-slate-800/40 rounded-xl hover:border-indigo-400 transition-colors cursor-pointer relative group">
            @if (fAttachmentUrl()) {
              <div class="flex flex-col items-center gap-2">
                <svg class="w-10 h-10 text-indigo-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span class="text-sm text-slate-300 font-medium truncate max-w-[200px]">document_attached.pdf</span>
                <button class="text-xs text-red-500 hover:text-red-700 mt-1" (click)="fAttachmentUrl.set(''); $event.stopPropagation()">삭제</button>
              </div>
            } @else {
              <svg class="w-8 h-8 text-indigo-600 mb-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              <p class="text-sm font-medium text-slate-200 mb-1">파일을 드래그하여 올려놓으세요</p>
              <p class="text-xs text-slate-500">또는 클릭해서 선택이 가능합니다</p>
            }
            <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" (change)="onFileChange($event)" />
          </div>
        </div>

        <hr class="border-slate-700 my-2" />

        <!-- 추가: 메모칸 -->
        <div class="flex flex-col gap-1.5">
          <label for="project-memo" class="text-sm font-semibold text-slate-200">관리자 메모</label>
          <textarea id="project-memo" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm min-h-[80px] resize-y" placeholder="내부 관리용 메모를 입력하세요" [ngModel]="fMemo()" (ngModelChange)="fMemo.set($event)"></textarea>
        </div>

        <!-- 추가: 내용 (에디터) -->
        <div class="flex flex-col gap-2">
          <label for="project-content" class="text-sm font-semibold text-slate-200">내용</label>
          <div class="border border-slate-700 rounded-lg overflow-hidden">
            <!-- 가짜 에디터 툴바 -->
            <div class="px-3 py-2 bg-slate-800 border-b border-slate-700 flex items-center gap-2">
              <button class="p-1.5 text-slate-400 hover:bg-slate-700 rounded text-xs font-bold">B</button>
              <button class="p-1.5 text-slate-400 hover:bg-slate-700 rounded text-xs italic">I</button>
              <button class="p-1.5 text-slate-400 hover:bg-slate-700 rounded text-xs underline">U</button>
              <div class="w-px h-4 bg-slate-600 mx-1"></div>
              <span class="text-xs text-slate-500">글꼴 크기 조절 기능 영역</span>
            </div>
            <!-- 에디터 본문 영역 -->
            <textarea id="project-content" class="w-full px-4 py-3 bg-slate-800 text-slate-200 placeholder-slate-500 focus:outline-none min-h-[250px] resize-y text-sm" placeholder="현황 관련 세부 내용을 마크다운이나 텍스트로 작성하세요." [ngModel]="fContent()" (ngModelChange)="fContent.set($event)"></textarea>
          </div>
        </div>

      </div>

      <!-- 모달 푸터 -->
      <div class="px-6 py-4 border-t border-slate-800 shrink-0">
        <button class="w-full px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50 flex items-center justify-center gap-2" [disabled]="saving()" (click)="save()">
          @if (saving()) { <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> }
          {{ saving() ? '저장 중...' : '등록' }}
        </button>
      </div>
    </div>
  </div>
}

@if (deleteTarget()) {
  <admin-confirm-dialog message="현황을 삭제하시겠습니까?" [loading]="deleting()" (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
}
