<style>
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-drawer { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-backdrop { animation: fadeIn 0.2s ease-out forwards; }
</style>

<div class="flex flex-col gap-6 p-6">

  <admin-page-header title="회사 소개 관리 (팀원)" />

  <!-- ── 데이터 그리드 ── -->
  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="data().length"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))">

    <!-- 검색 바를 데이터 테이블 내부의 슬롯으로 주입 (순서: 검색창 -> 라벨 -> 데이터 그리드) -->
    <div search-bar class="relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input type="text" class="w-full bg-slate-800/60 border border-slate-700/60 text-slate-200 text-sm rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:border-indigo-500/60 focus:bg-slate-800 placeholder-slate-500 transition-colors" placeholder="회사명 검색" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
    </div>
      <!-- 액션 바 -->
    <div action-bar class="flex items-center gap-2">
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors" (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        팀원 등록
      </button>
      <button class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors" title="엑셀 다운로드" (click)="onExportExcel()">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </admin-data-table>

</div>

<!-- 사이드 서랍: 폼 -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" (click)="closeForm()" (keydown.enter)="closeForm()" tabindex="0"></div>
    <div class="relative w-full max-w-md h-full bg-slate-900 border-l border-slate-700/60 shadow-2xl flex flex-col animate-drawer" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" tabindex="-1">

      <!-- 헤더 -->
      <div class="px-6 py-4 border-b border-slate-800 shrink-0">
        <button class="text-slate-500 hover:text-white text-lg mb-2 transition-colors" (click)="closeForm()">&raquo;</button>
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
      </div>

      <!-- 본문 -->
      <div class="flex flex-col gap-5 p-6 flex-1 overflow-y-auto">

        <div class="flex flex-col gap-1.5">
          <label for="company-sort-order" class="text-sm font-semibold text-slate-200">정렬 순서 <span class="text-red-400">*</span></label>
          <input id="company-sort-order" type="number" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" [ngModel]="fSortOrder()" (ngModelChange)="fSortOrder.set(+$event)" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="company-name" class="text-sm font-semibold text-slate-200">이름 <span class="text-red-400">*</span></label>
          <input id="company-name" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="홍길동" [ngModel]="fName()" (ngModelChange)="fName.set($event)" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="company-position" class="text-sm font-semibold text-slate-200">직함 <span class="text-red-400">*</span></label>
          <input id="company-position" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="CEO / 대표이사" [ngModel]="fPosition()" (ngModelChange)="fPosition.set($event)" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="company-bio" class="text-sm font-semibold text-slate-200">분야 (Bio)</label>
          <textarea id="company-bio" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500 min-h-[80px]" placeholder="담당 업무, 약력 등" [ngModel]="fBio()" (ngModelChange)="fBio.set($event)"></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="text-sm font-semibold text-slate-200">프로필 이미지</div>
          @if (fImagePreview()) {
            <div class="relative rounded-lg overflow-hidden border border-slate-700">
              <img [src]="fImagePreview()" class="w-full object-cover max-h-40" alt="프로필 미리보기" />
              <button class="absolute top-2 right-2 p-1 bg-slate-900/80 text-slate-400 hover:text-red-400 rounded-full transition-colors" (click)="removeImage()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          } @else {
            <label
              class="flex flex-col items-center justify-center gap-2 p-6 border-2 border-dashed border-slate-600 rounded-xl cursor-pointer hover:border-indigo-500 transition-colors"
              (dragover)="onDragOver($event)" (drop)="onDropFile($event)">
              <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M13.5 3.75h6m-6 0v6m0-6L6 11.25"/></svg>
              <span class="text-slate-400 text-xs">이미지를 드래그하거나 클릭해서 업로드</span>
              <input type="file" accept="image/*" class="hidden" (change)="onFileSelect($event)" />
            </label>
          }
        </div>
      </div>

      <!-- 푸터 -->
      <div class="px-6 py-4 border-t border-slate-800 shrink-0 flex gap-3">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">닫기</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50" [disabled]="saving()" (click)="save()">
          {{ saving() ? '저장 중...' : '저장' }}
        </button>
      </div>
    </div>
  </div>
}

@if (deleteTarget()) {
  <admin-confirm-dialog
    title="팀원 삭제"
    message="이 팀원 정보를 삭제하시겠습니까?"
    confirmLabel="삭제"
    [loading]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}
