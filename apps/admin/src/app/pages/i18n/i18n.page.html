<style>
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-drawer { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-backdrop { animation: fadeIn 0.2s ease-out forwards; }
</style>

<div class="flex flex-col gap-6 p-6">

  <!-- ── 헤더 ── -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-white">다국어 관리</h2>
      <p class="text-xs text-slate-400 mt-0.5">다국어 번역 키를 관리하고 미번역 항목을 확인합니다.</p>
    </div>
    <div class="flex items-center gap-2">
      <button
        class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors"
        (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        번역 추가
      </button>
      <button
        class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors"
        title="엑셀 다운로드"
        (click)="onExportExcel()"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </div>

  <!-- ── 액티브 탭 ── -->
  <div class="flex items-center gap-1 bg-slate-800/60 rounded-lg p-1">
    <button
      class="flex-1 px-4 py-1.5 text-sm font-medium rounded-md transition-colors"
      [class]="activeTab() === 'all' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'"
      (click)="switchTab('all')">
      전체
      <span class="ml-1.5 px-1.5 py-0.5 text-[10px] font-bold rounded-full"
            [class]="activeTab() === 'all' ? 'bg-white/20 text-white' : 'bg-slate-700 text-slate-400'">
        {{ allData().length }}
      </span>
    </button>
    <button
      class="flex-1 px-4 py-1.5 text-sm font-medium rounded-md transition-colors"
      [class]="activeTab() === 'untranslated' ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'"
      (click)="switchTab('untranslated')">
      미번역
      <span class="ml-1.5 px-1.5 py-0.5 text-[10px] font-bold rounded-full"
            [class]="activeTab() === 'untranslated' ? 'bg-white/20 text-white' : 'bg-amber-500/20 text-amber-400'">
        {{ untranslatedCount() }}
      </span>
    </button>
  </div>

  <!-- ── 데이터 그리드 ── -->
  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="filteredData().length"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))"
  />

</div>


<!-- 사이드 서랍: 번역 등록/수정 -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>
    <div class="relative w-full max-w-lg h-full bg-slate-900 border-l border-slate-700/60 shadow-2xl flex flex-col animate-drawer" tabindex="-1" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">

      <!-- 헤더 -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 shrink-0">
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
        <button class="p-2 -mr-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-colors" (click)="closeForm()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 본문 -->
      <div class="flex flex-col gap-5 p-6 flex-1 overflow-y-auto">

        <!-- 키 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-i18n-key" class="text-sm font-semibold text-slate-200">키 <span class="text-red-400">*</span></label>
          <input id="input-i18n-key" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="e.g. common.submit"
            [ngModel]="fKey()" (ngModelChange)="fKey.set($event)"
            [disabled]="!!editingItem()" />
          @if (editingItem()) {
            <span class="text-[10px] text-slate-500">키는 수정 시 변경할 수 없습니다.</span>
          }
        </div>

        <!-- 한국어 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-i18n-ko" class="text-sm font-semibold text-slate-200">한국어 <span class="text-red-400">*</span></label>
          <textarea id="input-i18n-ko" rows="3"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500 resize-y"
            placeholder="한국어 번역 값"
            [ngModel]="fKo()" (ngModelChange)="fKo.set($event)"></textarea>
        </div>

        <!-- 영어 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-i18n-en" class="text-sm font-semibold text-slate-200">영어</label>
          <textarea id="input-i18n-en" rows="3"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500 resize-y"
            placeholder="English translation"
            [ngModel]="fEn()" (ngModelChange)="fEn.set($event)"></textarea>
        </div>

        <!-- 일본어 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-i18n-ja" class="text-sm font-semibold text-slate-200">일본어</label>
          <textarea id="input-i18n-ja" rows="3"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500 resize-y"
            placeholder="日本語の翻訳"
            [ngModel]="fJa()" (ngModelChange)="fJa.set($event)"></textarea>
        </div>

      </div>

      <!-- 푸터 -->
      <div class="px-6 py-4 border-t border-slate-800 shrink-0 flex gap-3">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">닫기</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50" [disabled]="saving()" (click)="save()">
          {{ saving() ? '저장 중...' : '저장' }}
        </button>
      </div>

    </div>
  </div>
}

<!-- 삭제 확인 다이얼로그 -->
@if (deleteTarget()) {
  <admin-confirm-dialog
    title="번역 삭제"
    message="이 번역 키를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다."
    confirmLabel="삭제"
    [loading]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}
