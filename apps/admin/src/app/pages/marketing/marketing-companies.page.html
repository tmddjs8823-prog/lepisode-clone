<div class="flex flex-col gap-6 p-6">

  <admin-page-header title="마케팅 업체 관리" />

  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="total()"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))"
  >
    <!-- 검색 바를 데이터 테이블 내부의 슬롯으로 주입 -->
    <div search-bar class="relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input type="text" class="w-full bg-slate-800/60 border border-slate-700/60 text-slate-200 text-sm rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:border-indigo-500/60 focus:bg-slate-800 placeholder-slate-500 transition-colors" placeholder="업체명, 담당자 검색" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
    </div>
    <!-- 액션 바 -->
    <div action-bar class="flex items-center gap-2">
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors" (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        업체 등록
      </button>
      <button class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors" title="액셀 다운로드" (click)="onExportExcel()">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </admin-data-table>

</div>

@if (deleteTarget()) {
  <admin-confirm-dialog
    message="업체를 삭제하시겠습니까?"
    [subMessage]="deleteTarget()?.name + ' 업체를 삭제합니다.'"
    [loading]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}

<!-- ── 등록/수정 슬라이드 드로어 ── -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- 백드롭 -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>

    <!-- 드로어 -->
    <div class="relative w-full max-w-lg bg-slate-900 border-l border-slate-700 shadow-2xl flex flex-col animate-slide-in-right">

      <!-- 헤더 -->
      <div class="px-6 py-4 border-b border-slate-800 shrink-0">
        <button class="text-slate-500 hover:text-white text-lg mb-2 transition-colors" (click)="closeForm()">&raquo;</button>
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
      </div>

      <!-- 본문 -->
      <div class="flex flex-col gap-5 p-6 flex-1 overflow-y-auto">

        <!-- 업체명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-name" class="text-sm font-semibold text-slate-200">업체명 <span class="text-red-400">*</span></label>
          <input id="input-mkt-name" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="업체명을 입력하세요"
            [ngModel]="fName()" (ngModelChange)="fName.set($event)" />
        </div>

        <!-- 슬러그 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-slug" class="text-sm font-semibold text-slate-200">슬러그 (URL 경로) <span class="text-red-400">*</span></label>
          <input id="input-mkt-slug" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="예: goorum-tax"
            [ngModel]="fSlug()" (ngModelChange)="fSlug.set($event)" />
        </div>

        <!-- 담당자명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-manager" class="text-sm font-semibold text-slate-200">담당자명 <span class="text-red-400">*</span></label>
          <input id="input-mkt-manager" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="레피소드 담당자명을 입력하세요"
            [ngModel]="fManager()" (ngModelChange)="fManager.set($event)" />
        </div>

        <!-- 월 광고 예산 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-budget" class="text-sm font-semibold text-slate-200">월 광고 예산(원)</label>
          <input id="input-mkt-budget" type="number"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="0"
            [ngModel]="fBudget()" (ngModelChange)="fBudget.set($event)" />
          <span class="text-[10px] text-slate-500">기본값: 0원</span>
        </div>

        <!-- 공유 페이지 비밀번호 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-password" class="text-sm font-semibold text-slate-200">공유 페이지 비밀번호</label>
          <input id="input-mkt-password" type="password"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="미입력시 6자리 숫자가 자동 생성됩니다."
            [ngModel]="fPassword()" (ngModelChange)="fPassword.set($event)" />
        </div>

        <!-- ──── 경계선: 네이버 검색광고 ──── -->
        <div class="border-t border-slate-700/60 pt-5 mt-1">
          <h4 class="text-sm font-bold text-white">
            네이버 검색광고 설정
          </h4>
          <p class="text-[11px] text-slate-500 mt-1">네이버 검색광고 설정</p>
        </div>

        <!-- API Key -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-naver-api" class="text-sm font-semibold text-slate-200">API Key</label>
          <input id="input-mkt-naver-api" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="네이버 검색광고 API Key"
            [ngModel]="fNaverApiKey()" (ngModelChange)="fNaverApiKey.set($event)" />
        </div>

        <!-- Secret Key -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-naver-secret" class="text-sm font-semibold text-slate-200">Secret Key</label>
          <input id="input-mkt-naver-secret" type="password"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="Secret Key 입력"
            [ngModel]="fNaverSecretKey()" (ngModelChange)="fNaverSecretKey.set($event)" />
        </div>

        <!-- Customer ID -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-naver-cid" class="text-sm font-semibold text-slate-200">Customer ID</label>
          <input id="input-mkt-naver-cid" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="Customer ID 입력"
            [ngModel]="fNaverCustomerId()" (ngModelChange)="fNaverCustomerId.set($event)" />
        </div>

        <!-- 보고서 표시 채널 (체크박스) -->
        <div class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-200">보고서 표시 채널 <span class="text-[10px] text-slate-500 font-normal">(중복 선택 가능)</span></span>
          <div class="flex flex-wrap gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-0"
                [ngModel]="fChPowerlink()" (ngModelChange)="fChPowerlink.set($event)" />
              <span class="text-sm text-slate-300">파워링크</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-0"
                [ngModel]="fChPowerContent()" (ngModelChange)="fChPowerContent.set($event)" />
              <span class="text-sm text-slate-300">파워컨텐츠</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-0"
                [ngModel]="fChPlace()" (ngModelChange)="fChPlace.set($event)" />
              <span class="text-sm text-slate-300">플레이스</span>
            </label>
          </div>
        </div>

        <!-- ──── 경계선: GA4 설정 ──── -->
        <div class="border-t border-slate-700/60 pt-5 mt-1">
          <h4 class="text-sm font-bold text-white">
            GA4 설정
          </h4>
          <p class="text-[11px] text-slate-500 mt-1">Google Analytics 4 연동 정보를 입력합니다.</p>
        </div>

        <!-- GA4 Property ID -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-ga4-pid" class="text-sm font-semibold text-slate-200">Property ID</label>
          <input id="input-mkt-ga4-pid" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="Property ID 입력"
            [ngModel]="fGa4PropertyId()" (ngModelChange)="fGa4PropertyId.set($event)" />
        </div>

        <!-- 서비스 계정 키 (JSON) -->
        <div class="flex flex-col gap-1.5">
          <label for="input-mkt-ga4-key" class="text-sm font-semibold text-slate-200">서비스 계정 키 (JSON)</label>
          <textarea id="input-mkt-ga4-key" rows="6"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 font-mono text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500 resize-y"
            placeholder='{"type": "service_account", ...}'
            [ngModel]="fGa4ServiceAccountKey()" (ngModelChange)="fGa4ServiceAccountKey.set($event)"></textarea>
          <span class="text-[10px] text-slate-500">Google Cloud 콘솔에서 다운로드한 JSON 키 파일 내용을 붙여넣으세요.</span>
        </div>

      </div>

      <!-- 하단 버튼 -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-800 shrink-0">
        <button class="px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors" (click)="closeForm()">취소</button>
        <button
          class="flex items-center gap-2 px-5 py-2 text-sm font-medium text-white rounded-lg transition-colors"
          [class]="saving() ? 'bg-indigo-600/60 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500'"
          [disabled]="saving()"
          (click)="save()"
        >
          @if (saving()) {
            <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          }
          {{ editingItem() ? '수정' : '등록' }}
        </button>
      </div>
    </div>
  </div>
}
