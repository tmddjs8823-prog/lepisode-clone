<div class="flex flex-col gap-6 p-6">

  <!-- ── 헤더 ── -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-white">마케팅 수신동의 관리</h2>
      <p class="text-xs text-slate-400 mt-0.5">마케팅 수신에 동의한 사용자 목록입니다.</p>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-500">총 <span class="text-slate-300 font-semibold">{{ total() }}</span>명</span>
      <button
        class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors"
        title="엑셀 다운로드"
        (click)="onExportExcel()"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </div>

  <!-- ── 데이터 그리드 ── -->
  <admin-data-table
    [columns]="columns"
    [data]="$any(data())"
    [loading]="loading()"
    [total]="total()"
    [page]="page()"
    [limit]="limit"
    (pageChange)="onPageChange($event)"
    (delete)="onRevoke($any($event))"
  />

</div>

<!-- Confirm Dialog -->
@if (revokeTarget()) {
  <admin-confirm-dialog
    message="수신거부 처리하시겠습니까?"
    subMessage="{{ revokeTarget()?.name }} ({{ revokeTarget()?.email }}) 님을 수신거부 처리합니다."
    [loading]="revoking()"
    (confirmed)="confirmRevoke()"
    (cancelled)="cancelRevoke()"
  />
}
