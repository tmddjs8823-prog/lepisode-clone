<style>
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-drawer { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-backdrop { animation: fadeIn 0.2s ease-out forwards; }
</style>

<div class="flex flex-col gap-6 p-6">

  <admin-page-header title="기술 블로그 관리" />

  <!-- ── 데이터 그리드 ── -->
  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="data().length"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))">

    <!-- 검색 바를 데이터 테이블 내부의 슬롯으로 주입 (순서: 검색창 -> 라벨 -> 데이터 그리드) -->
    <div search-bar class="relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input type="text" class="w-full bg-slate-800/60 border border-slate-700/60 text-slate-200 text-sm rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:border-indigo-500/60 focus:bg-slate-800 placeholder-slate-500 transition-colors" placeholder="제목 검색" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
    </div>
      <!-- 액션 바 -->
    <div action-bar class="flex items-center gap-2">
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors" (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        포스트 등록
      </button>
      <button class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors" title="엑셀 다운로드" (click)="onExportExcel()">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </admin-data-table>

</div>


<!-- ══════════════════════════════════════════ -->
<!-- 블로그 등록/수정 사이드 서랍               -->
<!-- ══════════════════════════════════════════ -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>

    <div class="relative w-full max-w-3xl h-full bg-slate-900 border-l border-slate-700/60 shadow-2xl flex flex-col animate-drawer" tabindex="-1" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">

      <!-- 헤더 -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 shrink-0">
        <h3 class="text-lg font-bold text-white">{{ formTitle() }}</h3>
        <button class="p-2 -mr-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-colors" (click)="closeForm()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 본문 스크롤 영역 -->
      <div class="flex flex-col gap-6 p-6 flex-1 overflow-y-auto">

        <!-- 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-blog-title" class="text-sm font-semibold text-slate-200">제목 <span class="text-red-400">*</span></label>
          <input id="input-blog-title" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="블로그 제목을 입력해주세요." [ngModel]="fTitle()" (ngModelChange)="fTitle.set($event)" />
        </div>

        <!-- 설명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-blog-desc" class="text-sm font-semibold text-slate-200">설명</label>
          <textarea id="input-blog-desc" rows="3" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors resize-y" placeholder="블로그 설명을 입력해주세요." [ngModel]="fDescription()" (ngModelChange)="fDescription.set($event)"></textarea>
        </div>

        <!-- 카테고리 / 서브 카테고리 -->
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="input-blog-cat" class="text-sm font-semibold text-slate-200">카테고리 <span class="text-red-400">*</span></label>
            <input id="input-blog-cat" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="AI, 프론트엔드 등" [ngModel]="fCategory()" (ngModelChange)="fCategory.set($event)" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="input-blog-subcat" class="text-sm font-semibold text-slate-200">서브 카테고리</label>
            <input id="input-blog-subcat" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="뉴스레터, VectorDB 등" [ngModel]="fSubCategory()" (ngModelChange)="fSubCategory.set($event)" />
          </div>
        </div>

        <!-- 작성자 / 발행일 -->
        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="input-blog-author" class="text-sm font-semibold text-slate-200">작성자 <span class="text-red-400">*</span></label>
            <input id="input-blog-author" type="text" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="작성자 이름" [ngModel]="fAuthor()" (ngModelChange)="fAuthor.set($event)" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="input-blog-date" class="text-sm font-semibold text-slate-200">발행일</label>
            <input id="input-blog-date" type="date" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors" [ngModel]="fPublishedAt()" (ngModelChange)="fPublishedAt.set($event)" />
          </div>
        </div>

        <!-- 공개 토글 -->
        <div class="flex items-center gap-3">
          <button
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
            [class]="fPublished() ? 'bg-indigo-600' : 'bg-slate-700'"
            (click)="fPublished.set(!fPublished())">
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" [class]="fPublished() ? 'translate-x-6' : 'translate-x-1'"></span>
          </button>
          <span class="text-sm font-medium" [class]="fPublished() ? 'text-indigo-400' : 'text-slate-500'">{{ fPublished() ? '공개' : '비공개' }}</span>
        </div>

        <!-- 썸네일 이미지 -->
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-slate-200">썸네일 이미지 <span class="text-red-400">*</span></span>
          @if (fThumbnailPreview()) {
            <div class="relative rounded-lg overflow-hidden border border-slate-700">
              <img [src]="fThumbnailPreview()" class="w-full object-contain max-h-52 bg-slate-800" alt="썸네일 미리보기" />
              <button class="absolute top-2 right-2 p-1 bg-slate-900/80 text-slate-400 hover:text-red-400 rounded-full transition-colors" (click)="removeImage()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          } @else {
            <label
              class="flex flex-col items-center justify-center gap-2 p-8 border-2 border-dashed border-slate-600 rounded-xl cursor-pointer hover:border-indigo-500 transition-colors"
              (dragover)="onDragOver($event)" (drop)="onDropFile($event)">
              <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 00-2.25 2.25v9a2.25 2.25 0 002.25 2.25h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25H15m0-3l-3-3m0 0l-3 3m3-3v11.25"/></svg>
              <span class="text-slate-400 text-xs">파일을 드래그하여 올려놓으세요</span>
              <span class="text-slate-500 text-[11px]">또는 클릭해서 선택이 가능합니다</span>
              <input type="file" accept="image/*" class="hidden" (change)="onFileSelect($event)" />
            </label>
          }
        </div>

        <!-- ══════════════════════════════════ -->
        <!-- 본문 마크다운 에디터               -->
        <!-- ══════════════════════════════════ -->
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-slate-200">본문 <span class="text-red-400">*</span></span>

          <div class="border border-slate-700 rounded-xl overflow-hidden bg-slate-800/50">
            <!-- 에디터 툴바 -->
            <div class="flex items-center gap-0.5 px-3 py-2 border-b border-slate-700/50 bg-slate-800/80">
              <!-- Write/Preview 탭 -->
              <div class="flex bg-slate-700/50 rounded-lg p-0.5 mr-3">
                <button
                  class="px-3 py-1 text-xs font-medium rounded-md transition-colors"
                  [class]="editorMode() === 'write' ? 'bg-slate-600 text-white' : 'text-slate-400 hover:text-white'"
                  (click)="switchEditorMode('write')">Write</button>
                <button
                  class="px-3 py-1 text-xs font-medium rounded-md transition-colors"
                  [class]="editorMode() === 'preview' ? 'bg-slate-600 text-white' : 'text-slate-400 hover:text-white'"
                  (click)="switchEditorMode('preview')">Preview</button>
              </div>

              @if (editorMode() === 'write') {
                <!-- 서식 버튼들 -->
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors" title="제목 (H2)" (click)="insertMarkdown('heading')">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h8M4 6v12M12 6v12"/><path d="M17 12h3m-1.5-1.5v3" stroke-width="1.5"/></svg>
                </button>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors font-bold text-sm" title="굵게" (click)="insertMarkdown('bold')">B</button>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors italic text-sm" title="기울임" (click)="insertMarkdown('italic')">I</button>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors line-through text-sm" title="취소선" (click)="insertMarkdown('strike')">S</button>

                <div class="w-px h-5 bg-slate-700 mx-1"></div>

                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors" title="이미지" (click)="insertMarkdown('image')">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3 3h18v18H3z"/></svg>
                </button>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors" title="표" (click)="insertMarkdown('table')">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M10 3v18M14 3v18M3 3h18v18H3z"/></svg>
                </button>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors" title="링크" (click)="insertMarkdown('link')">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m9.193-9.193a4.5 4.5 0 00-6.364 0l-4.5 4.5a4.5 4.5 0 001.242 7.244"/></svg>
                </button>

                <div class="w-px h-5 bg-slate-700 mx-1"></div>

                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors font-mono text-xs" title="인라인 코드" (click)="insertMarkdown('code')">&lt;/&gt;</button>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md transition-colors font-mono text-xs" title="코드 블록" (click)="insertMarkdown('codeblock')">CB</button>
              }
            </div>

            <!-- 에디터 본문 -->
            @if (editorMode() === 'write') {
              <textarea
                #editorTextarea
                class="w-full min-h-[350px] bg-transparent text-slate-200 text-sm px-4 py-3 focus:outline-none resize-y font-mono leading-relaxed"
                placeholder="내용을 마크다운으로 입력하세요."
                [ngModel]="fContent()"
                (ngModelChange)="fContent.set($event)"
              ></textarea>
            } @else {
              <div class="prose prose-sm prose-invert max-w-none min-h-[350px] px-4 py-3 overflow-y-auto" [innerHTML]="previewHtml()"></div>
            }

            <!-- 하단 Markdown 표시 -->
            <div class="flex items-center justify-end px-3 py-1.5 border-t border-slate-700/50 bg-slate-800/40">
              <span class="text-[10px] text-slate-500 font-mono">Markdown</span>
            </div>
          </div>
        </div>

      </div>

      <!-- 푸터 -->
      <div class="px-6 py-4 border-t border-slate-800 shrink-0 flex gap-3">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">닫기</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50" [disabled]="saving()" (click)="save()">
          {{ saving() ? '저장 중...' : '저장' }}
        </button>
      </div>

    </div>
  </div>
}


<!-- 삭제 확인 다이얼로그 -->
@if (deleteTarget()) {
  <admin-confirm-dialog
    title="포스트 삭제"
    message="이 포스트를 삭제하시겠습니까?"
    confirmLabel="삭제"
    [loading]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}
