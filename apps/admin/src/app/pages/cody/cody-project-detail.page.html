<div class="flex flex-col gap-6 p-6 max-w-5xl mx-auto">

  <!-- 페이지 헤더 -->
  <div>
    <h1 class="text-xl font-bold text-white">프로젝트 관리</h1>
    <div class="flex items-center gap-1.5 mt-1 text-xs text-slate-500">
      <a class="text-indigo-400 hover:text-indigo-300 transition-colors cursor-pointer" tabindex="0" role="link" (click)="goBack()" (keydown.enter)="goBack()">레피소드</a>
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      <span>프로젝트 관리</span>
    </div>
  </div>

  @if (loading()) {
    <div class="flex items-center justify-center py-20">
      <span class="w-6 h-6 border-2 border-indigo-400/30 border-t-indigo-400 rounded-full animate-spin"></span>
    </div>
  }

  @if (item(); as p) {
    <!-- 프로젝트 정보 아코디언 -->
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden">
      <!-- 아코디언 헤더 -->
      <div
        class="flex items-center gap-3 px-6 py-4 cursor-pointer hover:bg-slate-800/80 transition-colors select-none"
        tabindex="0" role="button" (click)="infoOpen.set(!infoOpen())" (keydown.enter)="infoOpen.set(!infoOpen())">
        <svg class="w-4 h-4 text-slate-400 transition-transform shrink-0" [class.rotate-180]="infoOpen()" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        <span class="text-base font-semibold text-white">프로젝트 정보</span>
      </div>

      <!-- 아코디언 본문 -->
      @if (infoOpen()) {
        <div class="border-t border-slate-700/40">
          <div class="grid grid-cols-4 gap-0">
            <!-- 헤더 행 -->
            <div class="px-6 py-3 border-b border-slate-700/30">
              <span class="text-xs font-bold text-slate-400 tracking-wide">상태</span>
            </div>
            <div class="px-6 py-3 border-b border-slate-700/30">
              <span class="text-xs font-bold text-slate-400 tracking-wide underline underline-offset-4 decoration-slate-600">프로젝트명</span>
            </div>
            <div class="px-6 py-3 border-b border-slate-700/30">
              <span class="text-xs font-bold text-slate-400 tracking-wide underline underline-offset-4 decoration-slate-600">프로젝트 기간</span>
            </div>
            <div class="px-6 py-3 border-b border-slate-700/30">
              <span class="text-xs font-bold text-slate-400 tracking-wide">등록일시</span>
            </div>

            <!-- 데이터 행 -->
            <div class="px-6 py-4">
              <span class="inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-full {{ getStatusBadge(p.status).class }}">
                {{ getStatusBadge(p.status).label }}
              </span>
            </div>
            <div class="px-6 py-4">
              <span class="text-sm text-slate-200">{{ p.name }}</span>
            </div>
            <div class="px-6 py-4">
              <span class="text-sm text-slate-200">{{ formatPeriod() }}</span>
            </div>
            <div class="px-6 py-4">
              <span class="text-sm text-slate-200">{{ formatDateTime(p.createdAt) }}</span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- 하단 버튼 -->
    <div class="flex items-center gap-3">
      <button class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors" (click)="goBack()">
        목록
      </button>
    </div>
  }
</div>
