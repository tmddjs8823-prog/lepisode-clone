<div class="flex flex-col gap-6 p-6">

  <admin-page-header title="크레딧 관리" />

  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="total()"
    [page]="page()"
    [limit]="limit()"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="limit.set($event); page.set(1); loadData()">

    <!-- 검색 바를 데이터 테이블 내부의 슬롯으로 주입 (순서: 검색창 -> 라벨 -> 데이터 그리드) -->
    <div search-bar class="relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input type="text" class="w-full bg-slate-800/60 border border-slate-700/60 text-slate-200 text-sm rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:border-indigo-500/60 focus:bg-slate-800 placeholder-slate-500 transition-colors" placeholder="기업명 검색" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
    </div>
      <!-- 액션 바 -->
    <div action-bar class="flex items-center gap-2">
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors" (click)="openForm()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        크레딧 등록
      </button>
      <button class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors" title="엑셀 다운로드" (click)="onExportExcel()">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </admin-data-table>

</div>

<!-- ════════════ 등록/수정 드로어 ════════════ -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>
    <div class="relative w-full max-w-md h-full bg-slate-900 border-l border-slate-700/60 shadow-2xl flex flex-col animate-drawer">
      <div class="px-6 py-4 border-b border-slate-800 shrink-0">
        <button class="text-slate-500 hover:text-white text-lg mb-2 transition-colors" (click)="closeForm()">&raquo;</button>
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
      </div>
      <div class="flex flex-col gap-5 p-6 flex-1 overflow-y-auto">

        <!-- 유형 -->
        <div class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-200">유형 <span class="text-red-400">*</span></span>
          <div class="flex items-center gap-4">
            @for (t of typeOptions; track t) {
              <button type="button"
                class="flex items-center gap-2 text-sm transition-colors"
                (click)="fType.set(t)">
                <span class="relative flex items-center justify-center w-5 h-5 rounded-full border-2 transition-colors"
                  [class]="fType() === t ? 'border-indigo-500' : 'border-slate-600'">
                  @if (fType() === t) {
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                  }
                </span>
                <span [class]="fType() === t ? 'text-slate-100' : 'text-slate-400'">{{ t }}</span>
              </button>
            }
          </div>
        </div>

        <!-- 기업 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-company" class="text-sm font-semibold text-slate-200">기업 <span class="text-red-400">*</span></label>
          <select id="input-company"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            [ngModel]="fCompanyId()" (ngModelChange)="fCompanyId.set($event); fProjectId.set(null)">
            <option [ngValue]="null" disabled>기업 선택</option>
            @for (c of companyOptions(); track c.id) {
              <option [ngValue]="c.id">{{ c.name }}</option>
            }
          </select>
        </div>

        <!-- 프로젝트 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-project" class="text-sm font-semibold text-slate-200">프로젝트</label>
          <select id="input-project"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            [ngModel]="fProjectId()" (ngModelChange)="fProjectId.set($event)">
            <option [ngValue]="null">프로젝트 선택 (선택사항)</option>
            @for (p of filteredProjectOptions(); track p.id) {
              <option [ngValue]="p.id">{{ p.name }}</option>
            }
          </select>
        </div>

        <!-- 금액 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-amount" class="text-sm font-semibold text-slate-200">금액 <span class="text-red-400">*</span></label>
          <input id="input-amount" type="number"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="금액을 입력해주세요."
            [ngModel]="fAmount()" (ngModelChange)="fAmount.set(+$event)" />
        </div>

        <!-- 내용 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-description" class="text-sm font-semibold text-slate-200">내용 <span class="text-red-400">*</span></label>
          <input id="input-description" type="text"
            class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500"
            placeholder="크레딧 내용을 입력해주세요."
            [ngModel]="fDescription()" (ngModelChange)="fDescription.set($event)" />
        </div>

      </div>
      <div class="flex items-center gap-3 px-6 py-5 border-t border-slate-800 shrink-0">
        <button class="px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">취소</button>
        <div class="flex-1"></div>
        @if (editingItem()) {
          <button class="px-4 py-2.5 text-sm font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition-colors" (click)="onDelete($any(editingItem())); closeForm()">삭제</button>
        }
        <button class="flex items-center justify-center gap-2 px-6 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50" [disabled]="saving()" (click)="save()">
          @if (saving()) { <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> }
          저장
        </button>
      </div>
    </div>
  </div>
}

@if (deleteTarget()) {
  <admin-confirm-dialog message="크레딧을 삭제하시겠습니까?" [loading]="deleting()" (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
}
