<style>
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-drawer { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-backdrop { animation: fadeIn 0.3s ease-out forwards; }
</style>

<div class="flex flex-col gap-6 p-6">
  <admin-page-header title="공지사항 관리" createLabel="공지사항 등록" [showExport]="true" (exportExcel)="onExportExcel()" (create)="openForm()" />

  <admin-data-table
    [columns]="columns"
    [data]="$any(data())"
    [loading]="loading()"
    [total]="total()"
    [page]="page()"
    [limit]="limit"
    (edit)="openForm($any($event))"
    (delete)="onDelete($any($event))"
    (pageChange)="onPageChange($event)"
  />
</div>

<!-- 공지사항 폼 모달 (사이드 서랍 방식) -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- 백그라운드 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>
    
    <!-- 서랍 컨테이너 -->
    <div class="relative w-full max-w-3xl h-full bg-white shadow-2xl flex flex-col animate-drawer" tabindex="-1" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      
      <!-- 헤더 -->
      <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
        <div class="flex items-center gap-3">
          <h2 class="text-xl font-bold text-slate-800">{{ formTitle() }}</h2>
          <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
            <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded" [ngModel]="fIsPinned()" (ngModelChange)="fIsPinned.set($event)" />
            <span class="text-sm font-medium text-slate-600">상단 고정</span>
          </label>
        </div>
        <button class="p-2 -mr-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors" (click)="closeForm()">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 본문 -->
      <div class="p-8 overflow-y-auto flex-1 bg-slate-50 flex flex-col gap-8">
        
        <!-- 제목 섹션 -->
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-5">
          <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">기본 정보</h3>
          <div class="flex flex-col gap-1.5">
            <label for="input-notice-title" class="text-sm font-semibold text-slate-700">제목 <span class="text-indigo-500">*</span></label>
            <input id="input-notice-title" type="text" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="공지사항 제목" [ngModel]="fTitle()" (ngModelChange)="fTitle.set($event)" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
              <label for="input-notice-title-en" class="text-sm font-semibold text-slate-700">영문 제목</label>
              <input id="input-notice-title-en" type="text" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="Notice Title" [ngModel]="fTitleEn()" (ngModelChange)="fTitleEn.set($event)" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="input-notice-title-ja" class="text-sm font-semibold text-slate-700">일본어 제목</label>
              <input id="input-notice-title-ja" type="text" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="お知らせ" [ngModel]="fTitleJa()" (ngModelChange)="fTitleJa.set($event)" />
            </div>
          </div>
        </div>

        <!-- 썸네일 업로드 -->
        <div class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-700">썸네일 이미지</span>
          <div class="flex flex-col items-center justify-center p-6 border-2 border-dashed border-slate-300 bg-white rounded-xl hover:border-indigo-400 transition-colors cursor-pointer relative overflow-hidden group">
            @if (fThumbnailUrl()) {
              <img [src]="fThumbnailUrl()" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-40 transition-opacity" alt="썸네일 미리보기" />
              <span class="relative z-10 px-3 py-1 bg-slate-900/80 text-white text-xs rounded-full backdrop-blur-sm">이미지 변경</span>
            } @else {
              <p class="text-sm font-medium text-slate-600 mb-1">클릭하거나 이미지를 드래그하세요</p>
              <p class="text-xs text-slate-400">목록에 표시될 대표 이미지입니다</p>
            }
            <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" accept="image/*" (change)="onFileChange($event)" />
          </div>
        </div>

        <!-- 본문 (에디터) 섹션 -->
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-5">
          <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center justify-between">
            상세 내용 <span class="text-indigo-500">*</span>
          </h3>

          <div class="flex flex-col gap-1.5">
            <label for="input-notice-content-ko" class="text-xs font-semibold text-slate-500">한국어 본문</label>
            <div class="border border-slate-200 rounded-lg overflow-hidden focus-within:border-indigo-500 transition-all">
              <textarea id="input-notice-content-ko" class="w-full px-4 py-3 bg-slate-50 text-slate-800 focus:outline-none min-h-[200px] text-sm resize-y" placeholder="본문을 작성하세요..." [ngModel]="fContent()" (ngModelChange)="fContent.set($event)"></textarea>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="input-notice-content-en" class="text-xs font-semibold text-slate-500">영문 본문</label>
            <div class="border border-slate-200 rounded-lg overflow-hidden focus-within:border-indigo-500 transition-all">
              <textarea id="input-notice-content-en" class="w-full px-4 py-3 bg-slate-50 text-slate-800 focus:outline-none min-h-[120px] text-sm resize-y" placeholder="English content..." [ngModel]="fContentEn()" (ngModelChange)="fContentEn.set($event)"></textarea>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="input-notice-content-ja" class="text-xs font-semibold text-slate-500">일본어 본문</label>
            <div class="border border-slate-200 rounded-lg overflow-hidden focus-within:border-indigo-500 transition-all">
              <textarea id="input-notice-content-ja" class="w-full px-4 py-3 bg-slate-50 text-slate-800 focus:outline-none min-h-[120px] text-sm resize-y" placeholder="日本語のコンテンツ..." [ngModel]="fContentJa()" (ngModelChange)="fContentJa.set($event)"></textarea>
            </div>
          </div>
        </div>

      </div>

      <!-- 푸터 -->
      <div class="px-8 py-5 border-t border-slate-100 flex items-center justify-between bg-white shrink-0">
        <label class="flex items-center gap-3 cursor-pointer group">
          <div class="relative w-11 h-6 bg-slate-200 rounded-full peer-checked:bg-indigo-600 transition-colors" [class.bg-indigo-600]="fPublished()">
            <div class="absolute top-[2px] left-[2px] bg-white border border-slate-200 rounded-full h-5 w-5 transition-transform shadow-sm group-hover:scale-105" [class.translate-x-5]="fPublished()"></div>
          </div>
          <span class="text-sm font-bold text-slate-700">공개 여부</span>
          <input type="checkbox" class="sr-only" [ngModel]="fPublished()" (ngModelChange)="fPublished.set($event)">
        </label>

        <div class="flex items-center gap-3">
          <button class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-colors" (click)="closeForm()">취소</button>
          <button class="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition-all flex items-center gap-2" (click)="save()" [disabled]="saving()">
            @if (saving()) { <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> }
            저장하기
          </button>
        </div>
      </div>
    </div>
  </div>
}

@if (deleteTarget()) {
  <admin-confirm-dialog message="공지사항을 삭제하시겠습니까?" [loading]="deleting()" (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
}
