<style>
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-drawer { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .animate-backdrop { animation: fadeIn 0.3s ease-out forwards; }
</style>

<div class="flex flex-col gap-6 p-6">
  <admin-page-header title="공지사항 관리" />

  <admin-data-table
    [columns]="columns"
    [data]="$any(filteredData())"
    [loading]="loading()"
    [total]="total()"
    [page]="page()"
    [limit]="limit()"
    (rowClick)="navigateToDetail($any($event))"
    (edit)="navigateToDetail($any($event))"
    (delete)="onDelete($any($event))"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="limit.set($event); page.set(1); loadData()">

    <!-- 검색 바 -->
    <div search-bar class="relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input type="text" class="w-full bg-slate-800/60 border border-slate-700/60 text-slate-200 text-sm rounded-lg pl-10 pr-10 py-2.5 focus:outline-none focus:border-indigo-500/60 focus:bg-slate-800 placeholder-slate-500 transition-colors" placeholder="제목 검색" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
    </div>
    <!-- 액션 바 -->
    <div action-bar class="flex items-center gap-2">
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors" (click)="openForm()">
        등록
      </button>
      <button class="p-2 text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 rounded-lg border border-slate-700 hover:border-emerald-500/30 transition-colors" title="엑셀 다운로드" (click)="onExportExcel()">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#217346" d="M23 1.5q.41 0 .7.3.3.29.3.7v19q0 .41-.3.7-.29.3-.7.3H7q-.41 0-.7-.3-.3-.29-.3-.7V18H2.5q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7.29-.3.7-.3H6V2.5q0-.41.3-.7.29-.3.7-.3zM6 13.28l1.42 2.66h2.14l-2.38-3.87 2.34-3.8H7.46l-1.3 2.4-.05.08-.04.09-.64-1.28-.66-1.29H2.59l2.27 3.82-2.48 3.85h2.2zM23 17V7h-6v1.4h4.2v1.43h-4.2v1.4h4.2v1.44h-4.2v1.4h4.2v1.43h-4.2V17z"/></svg>
      </button>
    </div>
  </admin-data-table>
</div>

<!-- 공지사항 폼 모달 (사이드 서랍 방식) -->
@if (showForm()) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <!-- 백그라운드 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-backdrop" role="button" tabindex="-1" (click)="closeForm()" (keydown.escape)="closeForm()"></div>
    
    <!-- 서랍 컨테이너 -->
    <div class="relative w-full max-w-3xl h-full bg-slate-900 shadow-2xl flex flex-col animate-drawer" tabindex="-1" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      
      <!-- 헤더 -->
      <div class="px-6 py-4 border-b border-slate-800 shrink-0">
        <button class="text-slate-500 hover:text-white text-lg mb-2 transition-colors" (click)="closeForm()">&raquo;</button>
        <h3 class="text-base font-semibold text-white">{{ formTitle() }}</h3>
      </div>

      <!-- 본문 -->
      <div class="p-8 overflow-y-auto flex-1 bg-slate-900/50 flex flex-col gap-8">
        
        <!-- 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-notice-title" class="text-sm font-semibold text-slate-200">공지사항 제목 <span class="text-indigo-500">*</span></label>
          <input id="input-notice-title" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="공지사항 제목을 입력해주세요." [ngModel]="fTitle()" (ngModelChange)="fTitle.set($event)" />
        </div>

        <!-- 영문 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-notice-title-en" class="text-sm font-semibold text-slate-200">공지사항 영문 제목</label>
          <input id="input-notice-title-en" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="공지사항 영문 제목을 입력해주세요." [ngModel]="fTitleEn()" (ngModelChange)="fTitleEn.set($event)" />
        </div>

        <!-- 일본어 제목 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-notice-title-ja" class="text-sm font-semibold text-slate-200">공지사항 일본어 제목</label>
          <input id="input-notice-title-ja" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="공지사항 일본어 제목을 입력해주세요." [ngModel]="fTitleJa()" (ngModelChange)="fTitleJa.set($event)" />
        </div>

        <!-- SEO 타이틀 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-notice-seo" class="text-sm font-semibold text-slate-200">SEO 타이틀</label>
          <input id="input-notice-seo" type="text" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 transition-all text-sm" placeholder="자동 생성되며 필요 시 수정할 수 있습니다." [ngModel]="fSeoTitle()" (ngModelChange)="fSeoTitle.set($event)" />
        </div>

        <!-- 메타 설명 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-notice-meta" class="text-sm font-semibold text-slate-200">메타 설명</label>
          <textarea id="input-notice-meta" rows="3" class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 transition-all text-sm resize-none" placeholder="자동 생성되며 필요 시 수정할 수 있습니다." [ngModel]="fMetaDesc()" (ngModelChange)="fMetaDesc.set($event)"></textarea>
        </div>

        <!-- 썸네일 업로드 -->
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-slate-200">썸네일 이미지</span>
          <div class="flex flex-col gap-2">
            @if (fThumbnailPreview()) {
              <div class="relative group">
                <img [src]="fThumbnailPreview()" alt="썸네일 미리보기" class="w-full h-40 object-cover rounded-xl border border-slate-700" />
                <button class="absolute top-2 right-2 p-1.5 bg-slate-900/80 border border-slate-700 rounded-lg text-slate-400 hover:text-red-400 transition-colors opacity-0 group-hover:opacity-100" (click)="removeThumbnail()">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            } @else {
              <label class="flex flex-col items-center justify-center gap-3 px-6 py-8 bg-slate-800/40 border-2 border-dashed border-slate-700 hover:border-indigo-500/50 rounded-xl cursor-pointer transition-colors">
                <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
                <span class="text-sm text-slate-400">클릭하여 썸네일 이미지를 선택하세요</span>
                <span class="text-[11px] text-slate-600">JPG, PNG, WebP 파일 지원</span>
                <input type="file" accept="image/*" class="hidden" (change)="onFileChange($event)" />
              </label>
            }
          </div>
        </div>

        <!-- 등록일자 -->
        <div class="flex flex-col gap-1.5">
          <label for="input-notice-date" class="text-sm font-semibold text-slate-200">등록일자</label>
          <input id="input-notice-date" type="date" class="w-1/2 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500 transition-all text-sm" [ngModel]="fCreatedAt()" (ngModelChange)="fCreatedAt.set($event)" />
          <span class="text-[11px] text-slate-500">비우면 현재 시간으로 자동 설정됩니다.</span>
        </div>

        <!-- 한국어 본문 -->
        <div class="flex flex-col gap-1.5">
          <div class="text-sm font-semibold text-slate-200">한국어 본문 <span class="text-indigo-500">*</span></div>
          <admin-rich-editor [ngModel]="fContent()" (ngModelChange)="fContent.set($event)" />
        </div>

        <!-- 영어 본문 -->
        <div class="flex flex-col gap-1.5">
          <div class="text-sm font-semibold text-slate-200">영어 본문</div>
          <admin-rich-editor [ngModel]="fContentEn()" (ngModelChange)="fContentEn.set($event)" />
        </div>

        <!-- 일본어 본문 -->
        <div class="flex flex-col gap-1.5">
          <div class="text-sm font-semibold text-slate-200">일본어 본문</div>
          <admin-rich-editor [ngModel]="fContentJa()" (ngModelChange)="fContentJa.set($event)" />
        </div>
      <!-- 게시 여부 -->
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold text-slate-200">게시 여부</span>
          <button
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
            [class]="fPublished() ? 'bg-indigo-600' : 'bg-slate-700'"
            (click)="fPublished.set(!fPublished())">
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" [class]="fPublished() ? 'translate-x-6' : 'translate-x-1'"></span>
          </button>
          <span class="text-xs" [class]="fPublished() ? 'text-indigo-400' : 'text-slate-500'">{{ fPublished() ? '공개' : '비공개' }}</span>
        </div>

      </div>

      <!-- 푸터 -->
      <div class="px-6 py-4 border-t border-slate-800 shrink-0 flex gap-3">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors" (click)="closeForm()">닫기</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors disabled:opacity-50 flex items-center justify-center gap-2" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> }
          저장
        </button>
      </div>
    </div>
  </div>
}

@if (deleteTarget()) {
  <admin-confirm-dialog message="공지사항을 삭제하시겠습니까?" [loading]="deleting()" (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
}
