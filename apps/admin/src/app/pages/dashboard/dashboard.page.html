<div class="p-6">
  <h2 class="text-xl font-semibold text-white mb-6">대시보드</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
    @for (stat of stats; track stat.label) {
      <div class="bg-slate-800 border border-slate-700/50 rounded-xl p-5">
        <p class="text-xs text-slate-400 font-medium">{{ stat.label }}</p>
        <p class="text-2xl font-bold text-white mt-1">{{ stat.value }}</p>
        <p class="text-xs text-slate-500 mt-1">{{ stat.sub }}</p>
      </div>
    }
  </div>

  <div class="bg-slate-800 border border-slate-700/50 rounded-xl p-5">
    <h3 class="text-sm font-semibold text-white mb-3">빠른 메뉴</h3>
    <p class="text-xs text-slate-400">좌측 사이드바에서 원하는 메뉴를 선택하세요.</p>
  </div>
</div>
